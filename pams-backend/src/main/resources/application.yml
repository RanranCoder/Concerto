server:
  port: 8080

spring:
  application:
    name: pams-backend
  config:
    # 让应用**自己**读仓库根的 .env（KEY=VALUE 与 properties 同形，故用 [.properties] 指定解析器）。
    #
    # 为什么需要：IDEA 的 Run Configuration 不读 .env，`mvn spring-boot:run` 也不读（pom 里没有 dotenv 依赖），
    # 只有 start.bat 会载入 —— 三条启动路径的行为不一致，IDE 里就永远降级成 stub，
    # 前端表现为「永远是规则模式」，与密钥/网络无关（start.bat 第 4-8 行注释记的同一个坑）。
    #
    # 为什么两个相对路径都写：CWD 可能是模块根（IDE 默认；mvn 在 pams-backend 下跑 → ../.env），
    # 也可能是仓库根（mvn -f pams-backend/pom.xml 从根跑 → ./.env）。
    #
    # optional: 缺文件时跳过而不是启动失败 —— docker/CI 是直接注入环境变量，根本没有这个文件。
    # 优先级不变：环境变量仍优先（AgentProperties.resolveApiKey 先读 System.getenv，
    # 再回落到这里导入的 pams.agent.api-key 占位值）。
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/pams_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # 多租户判别器（A3）：标了 @TenantId 的实体按 OrgContext 自动过滤/回填
        tenant_identifier_resolver: com.pams.config.OrgTenantIdentifierResolver
  flyway:
    enabled: true
    # db/migration = 双库通用迁移；db/migration-mysql = MySQL 专有迁移（如 V25 动态 DDL）。
    # 测试 profile 用 db/migration-h2 对应实现（见下方 test 段）。
    locations: classpath:db/migration,classpath:db/migration-mysql
    # pams_db 已由 Task 2 建表（非空但无 history 表）。baseline-on-migrate + baseline-version=0
    # 让 Flyway 在空历史上建 baseline(0) 后真实执行 V1（DDL 全部 IF NOT EXISTS，幂等安全），
    # 从而在运行时校验 DDL 兼容性。
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

pams:
  jwt:
    # 签名密钥：生产链路（docker-compose/deploy.sh）强制经 PAMS_JWT_SECRET 注入；
    # 本地 IDEA/mvn 直跑未设置时，回退为每次启动随机生成的密钥（重启后需重新登录，本地可接受），
    # 仓库内不存在任何固定默认密钥（2026-08 审计 P1 修复）。
    # 注意：两个 random.uuid 拼接共 72 字符（576 位），满足 HMAC 最小密钥长度。
    secret: ${PAMS_JWT_SECRET:${random.uuid}${random.uuid}}
    expire-hours: 24
  upload-dir: ./uploads
  # ===================== 灵思（Agent） =====================
  # 密钥治理口径与 jwt.secret 一致：优先环境变量 PAMS_AGENT_API_KEY。
  # 若两者都为空，LlmConfig 会自动降级为 stub 规则模式（不阻塞启动，离线可演示）。
  agent:
    provider: openai
    protocol: ${PAMS_AGENT_PROTOCOL:openai_chat_completions}
    base-url: ${PAMS_AGENT_BASE_URL:https://api.openai.com/v1}
    model: ${PAMS_AGENT_MODEL:}
    timeout-ms: 30000
    max-tokens: 8192
    temperature: 0.3
    summary-enabled: ${PAMS_AGENT_SUMMARY_ENABLED:false}
    provider-encryption-key: ${PAMS_AI_ENCRYPTION_KEY:}
    provider-key-file: ${PAMS_AI_KEY_FILE:./data/secrets/ai-provider.key}
    provider-internal-hosts: ${PAMS_AI_INTERNAL_HOSTS:}
    context-rounds: 6
    max-tool-iterations: 5
    stream-buffer-size: 500
    executor-core-size: 4
    executor-max-size: 8
    executor-queue-capacity: 64
    # 密钥只经环境变量注入，默认值必须为空（仓库/镜像内不存在任何真实密钥，2026-09-22 审计 #10 修复）。
    # 未设置 PAMS_AGENT_API_KEY 时 LlmConfig 自动降级为 stub 规则模式，不影响启动。
    api-key: ${PAMS_AGENT_API_KEY:}

# 测试库用 H2(MySQL 模式) + Flyway 同迁移脚本
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:pams;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    # H2 走 db/migration-h2（V25 的 H2 分支），避免 MySQL 专有动态 DDL 在 H2 上失败。
    locations: classpath:db/migration,classpath:db/migration-h2
pams:
  jwt:
    secret: test-only-jwt-secret-0123456789abcdef0123456789abcdef
  agent:
    # ⚠️ 测试**永不打真实 API**：上面那条 .env 导入会在"开发者本机存在 .env"时把真 Key 带进来，
    # 若不在这里显式压住，`mvn test` 就会真的实例化 原生 OpenAI 客户端 ——
    # 任何碰到 LLM 的测试都会变成对外发请求（慢、花钱、结果不稳定），而且只在有 .env 的机器上复现。
    # 需要验证"导入生效 / 有 Key 就选原生协议"时，用环境变量显式打开：
    #   PAMS_TEST_AGENT_PROVIDER=openai mvn -o -Dtest=... test
    provider: ${PAMS_TEST_AGENT_PROVIDER:stub}
    provider-key-file: ./target/test-data/ai-provider.key
