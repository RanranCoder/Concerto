server {
    listen 80;
    server_name concerto.yuanlab.work;
    return 308 https://concerto.yuanlab.work$request_uri;
}

server {
    listen 443 ssl;
    server_name concerto.yuanlab.work;
    ssl_certificate /etc/letsencrypt/live/concerto.yuanlab.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concerto.yuanlab.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 205m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/notifications/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_connect_timeout 60s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
