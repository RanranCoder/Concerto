<script>
// ══════════════ onetake · 猫猫与毛线球 — every value a pure function of t ══════════════
const FPS = 30, DUR = 30;
window.__meta = {
  dur: DUR, fps: FPS, w: 1920, h: 1080,
  cuts: [5.36, 5.74, 6.10],                      // staccato burst — bare cuts on purpose
  inFrame: {
    ball: [1.3, 30, 'whole'],
    cat:  [20.0, 24.5, 'whole'],
    wm:   [26.6, 30, 'whole']
  }
};
const {clamp, lerp, sstep, ssstep, spline} = OM;

// ─────────────────────────── world layout (continuous cream desk) ───────────────────────────
// journey: cat (2600,2560) → schedule (890,1160) → roster (1760,2470) → knot (2745,2130) → signin (3020,2230) → plan (4190,1110) → back to cat
const WAY = [
  {t:1.12, x:2470, y:2620}, {t:1.55, x:2170, y:2470}, {t:1.95, x:1720, y:2130},
  {t:2.30, x:1180, y:1420}, {t:2.60, x:1010, y:1250}, {t:5.30, x:985,  y:1245},
  {t:5.90, x:1320, y:1800}, {t:6.55, x:1640, y:2310}, {t:7.10, x:1770, y:2420},
  {t:8.70, x:1800, y:2445}, {t:9.35, x:2170, y:2330}, {t:10.05,x:2660, y:2165},
  {t:10.60,x:2745, y:2130}, {t:11.05,x:2950, y:2195}, {t:11.45,x:3060, y:2265},
  {t:13.30,x:3120, y:2305}, {t:13.85,x:3620, y:1720}, {t:14.35,x:4020, y:1330},
  {t:16.90,x:4130, y:1275}, {t:17.60,x:4110, y:1330}, {t:18.35,x:3480, y:1900},
  {t:19.10,x:2980, y:2360}, {t:19.85,x:2700, y:2545}, {t:21.00,x:2642, y:2596}
];
const ballPos = t => { const p = spline(WAY, clamp(t, 1.12, 21.0)); return [p[0], p[1]]; };

// camera: keyed, operated (chase with lag, snap on expo, hand float, shake on landings)
const KEYS = [
  { t: 0.0,  x: 2540, y: 2455, zoom: 1.10 },
  { t: 1.15, x: 2505, y: 2480, zoom: 1.10 },
  { t: 1.95, x: 1900, y: 2000, zoom: 0.98, curve: OM.ease.sineInOut },  // lead the ball's dip
  { t: 2.50, x: 1045, y: 1120, zoom: 0.92, curve: OM.ease.sineInOut },
  { t: 5.32, x: 1025, y: 1115, zoom: 0.92 },
  { t: 6.60, x: 1735, y: 2100, zoom: 1.00, curve: OM.ease.sineInOut },
  { t: 8.70, x: 1775, y: 2135, zoom: 1.00 },
  { t: 9.35, x: 1780, y: 2138, zoom: 1.00 },
  { t: 10.62,x: 2725, y: 1985, zoom: 1.06, curve: OM.ease.sineInOut },
  { t: 11.42,x: 2985, y: 2145, zoom: 1.12, curve: OM.ease.expoOut },   // snap to signin before the stamp lands
  { t: 13.30,x: 2995, y: 2150, zoom: 1.12 },
  { t: 14.45,x: 4085, y: 1065, zoom: 0.94, curve: OM.ease.sineInOut },
  { t: 16.95,x: 4095, y: 1070, zoom: 0.94 },
  { t: 17.62,x: 4100, y: 1072, zoom: 0.94 },
  { t: 18.45,x: 3350, y: 1880, zoom: 1.05, curve: OM.ease.expoOut },   // whip ahead of the ball
  { t: 19.95,x: 2665, y: 2470, zoom: 1.10, curve: OM.ease.sineInOut }, // settle at the cat
  { t: 21.40,x: 2660, y: 2472, zoom: 1.10 },
  { t: 23.40,x: 2660, y: 2474, zoom: 1.10 },
  { t: 25.30,x: 2700, y: 2215, zoom: 0.80, curve: OM.ease.quintInOut }, // pull out for the lockup
  { t: 30.0, x: 2700, y: 2215, zoom: 0.80 }
];
const HITS = [[1.10, 7, 8], [11.42, 9, 9], [19.85, 8, 8], [20.45, 5, 8], [24.62, 6, 9]]; // paw, stamp landing, catch, bow pop
// hand float: zero on every hold so the rests are dead still
const handEnv = t =>
  OM.sstep(1.6, 2.1, t) * (1 - OM.sstep(26.9, 27.2, t)) *
  (1 - OM.sstep(4.85, 5.32, t) + OM.sstep(5.75, 6.15, t)) *
  (1 - OM.sstep(8.6, 9.35, t) + OM.sstep(9.5, 9.9, t)) *
  (1 - OM.sstep(11.6, 13.3, t) + OM.sstep(13.5, 13.8, t)) *
  (1 - OM.sstep(16.85, 17.62, t) + OM.sstep(17.8, 18.1, t)) *
  (1 - OM.sstep(21.2, 23.4, t) + OM.sstep(23.55, 23.95, t));
function camAt(t) {
  const c = OM.camera(t, KEYS), e = handEnv(t) * 3.6;
  let x = c.x + e * (Math.sin(1.7 * t) + 0.6 * Math.sin(2.9 * t + 1)) / c.zoom;
  let y = c.y + e * (Math.sin(1.3 * t + 2) + 0.5 * Math.sin(3.3 * t)) / c.zoom;
  let rot = 0;
  for (const [th, amp, decay] of HITS) {
    const s = OM.shake(t, th, { amp, decay, seed: Math.round(th * 100) });
    x += s.x / c.zoom; y += s.y / c.zoom; rot += s.rot;
  }
  return { x, y, zoom: c.zoom, rot };
}

// ─────────────────────────── DOM build ───────────────────────────
const $ = id => document.getElementById(id);
const ROWS = ['第1-2节', '第3-4节', '第5-6节', '第7-8节', '第9-10节'];
const COLS = ['周一', '周二', '周三', '周四', '周五'];
const CELLS = [
  [0,0,'busy','高等数学<br>(1-16)'], [0,1,'free','空'], [0,2,'busy','大学英语<br>(1-16)'], [0,3,'free','空'], [0,4,'busy','班会<br>(2-16)'],
  [1,0,'free','空'], [1,1,'busy','程序设计<br>(3-14)'], [1,2,'ai','12人空闲'], [1,3,'ai','12人空闲'], [1,4,'free','空'],
  [2,0,'busy','体育<br>(1-16)'], [2,1,'free','空'], [2,2,'free','空'], [2,3,'busy','形势政策<br>(5-12)'], [2,4,'free','空'],
  [3,0,'free','空'], [3,1,'busy','实验课<br>(4-15)'], [3,2,'free','空'], [3,3,'free','空'], [3,4,'busy','职业规划<br>(6-12)'],
  [4,0,'busy','晚自习<br>(1-16)'], [4,1,'free','空'], [4,2,'busy','晚自习<br>(1-16)'], [4,3,'free','空'], [4,4,'free','空']
];
const SNAPS = [[0,0],[0,2],[1,1],[2,0],[3,1],[4,0],[4,2],[2,3],[0,4],[3,4]];
(function buildGrid() {
  const g = $('sgrid');
  const cw = 186, ch = 96, gx = 12, gy = 12;
  COLS.forEach((c, j) => {
    const d = document.createElement('div');
    d.className = 'gcell head'; d.textContent = c;
    d.style.cssText += `left:${70 + j * (cw + gx)}px;top:0;width:${cw}px;height:44px`;
    g.appendChild(d);
  });
  ROWS.forEach((r, i) => {
    const d = document.createElement('div');
    d.className = 'gcell head'; d.textContent = r;
    d.style.cssText += `left:0;top:${62 + i * (ch + gy)}px;width:62px;height:${ch}px;font-size:17px`;
    g.appendChild(d);
  });
  CELLS.forEach(([r, c, kind, text]) => {
    const d = document.createElement('div');
    d.className = 'gcell ' + kind; d.innerHTML = text;
    d.style.cssText += `left:${70 + c * (cw + gx)}px;top:${62 + r * (ch + gy)}px;width:${cw}px;height:${ch}px`;
    d.dataset.snap = SNAPS.findIndex(([sr, sc]) => sr === r && sc === c);
    g.appendChild(d);
  });
})();
const MEMBERS = [
  ['李想', '2435101020101 · 24物联网班 · 干事', '在职'],
  ['王慧', '2435101020102 · 24计网3班 · 部长', '在职'],
  ['张伟', '2435101020103 · 24软件技术1班 · 干事', '在职']
];
(function buildRoster() {
  const s = $('mstack');
  MEMBERS.forEach(([nm, meta, st], i) => {
    const d = document.createElement('div');
    d.className = 'mcard';
    d.innerHTML = `<div class="nm">${nm}</div><div class="meta">${meta}</div><div class="st"><span class="chip green">${st}</span></div>`;
    d.style.cssText += `left:${40 + i * 90}px;top:${20 + i * 108}px`;
    s.appendChild(d);
  });
})();
(function buildPpl() {
  const p = $('ppl');
  [['李想','2435101020101',1],['王慧','2435101020102',1],['张伟','2435101020103',1],['陈静','2435101020104',0]].forEach(([nm, sid, done], i) => {
    const d = document.createElement('div');
    d.className = 'ppill' + (done ? ' done' : ''); d.id = 'pp' + i;
    d.innerHTML = `<b>${nm}</b><span>${sid}</span>`;
    p.appendChild(d);
  });
})();
const WM = [...'党建工作台'];
const wmSpans = WM.map(ch => { const s = document.createElement('span'); s.textContent = ch; $('wm').appendChild(s); return s; });

// trail's far end: grows out to 17.6 s, then reels back toward the cat
const trailEnd = t => t <= 17.6 ? clamp(t, 1.12, 17.6) : lerp(17.6, 1.28, sstep(18.3, 20.7, t));
// ─────────────────────────── yarn (canvas, world coords) ───────────────────────────
const cv = $('yarn'), ctx = cv.getContext('2d');
function drawYarn(t) {
  const DPR = 2;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  const V = OM.view(camAt(t));
  ctx.setTransform(DPR * V[0], DPR * V[1], DPR * V[2], DPR * V[3], DPR * V[4], DPR * V[5]);
  const t0 = 1.12;
  const t1 = trailEnd(t);
  if (t < 1.12 || t1 <= t0) return;
  const N = 120;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    pts.push(spline(WAY, lerp(t0, t1, i / N)));
  }
  const wob = (i, o) => Math.sin(i * 0.21 + o * 2.1) * 3.2 + Math.sin(i * 0.07 + o) * 2.1;
  for (let o = -1; o <= 1; o++) {
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const [x, y] = pts[i];
      const [x2, y2] = pts[Math.min(i + 1, pts.length - 1)];
      const dx = x2 - x, dy = y2 - y, L = Math.hypot(dx, dy) || 1;
      const nx = -dy / L, ny = dx / L, off = o * 5.5 + wob(i, o);
      const px = x + nx * off, py = y + ny * off;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.lineWidth = o === 0 ? 6.5 : 2.4;
    ctx.strokeStyle = o === 0 ? '#DE2910' : '#B92713';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke();
  }
  // knot: tightening loop in the air (10.0–10.75) → becomes the stamp
  if (t > 10.0 && t < 10.75) {
    const k = sstep(10.05, 10.62, t);
    const r = lerp(120, 52, k);
    ctx.beginPath();
    for (let i = 0; i <= 60; i++) {
      const a = -Math.PI / 2 + (i / 60) * Math.PI * 2 * 2 * (0.4 + 0.6 * k);
      const rr = r * (1 - 0.25 * (i / 60));
      const x = 2745 + Math.cos(a) * rr, y = 2130 + Math.sin(a) * rr * 0.86;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.lineWidth = 6.5; ctx.strokeStyle = '#DE2910'; ctx.lineCap = 'round'; ctx.stroke();
  }
  // bow: two loops + knot near the cat (from 20.2)
  if (t > 20.2) {
    const pop = OM.impact(t, 20.22, { decay: 6, omega: 17, sqx: 0.25, sqy: 0.25 });
    const s = pop.sx;
    const cx = 2642, cy = 2596;
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.translate(cx + side * 58 * s, cy - 26 * s);
      ctx.rotate(side * 0.5);
      ctx.beginPath();
      ctx.ellipse(0, 0, 74 * s, 42 * s, 0, 0, Math.PI * 2);
      ctx.lineWidth = 7; ctx.strokeStyle = '#DE2910'; ctx.stroke();
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(cx, cy, 52 * s, 0, Math.PI * 2);
    ctx.lineWidth = 5; ctx.strokeStyle = '#DE2910'; ctx.stroke();
  }
}

// ─────────────────────────── ball (DOM) ───────────────────────────
const ballEl = document.createElement('div');
ballEl.id = 'ball';
ballEl.style.cssText = `position:absolute;width:88px;height:88px;border-radius:50%;left:-44px;top:-44px;
  background:radial-gradient(circle at 34% 30%, #ff6b52, #DE2910 62%, #a91f0c);
  box-shadow:0 18px 32px -10px rgba(180,50,20,.45);will-change:transform,opacity;display:none`;
ballEl.innerHTML = `<svg viewBox="0 0 88 88" style="position:absolute;inset:0;width:88px;height:88px">
  <path d="M18 40 Q44 18 70 36 Q52 58 26 52 Q48 68 74 58" fill="none" stroke="#9c1d0b" stroke-width="4" stroke-linecap="round" opacity=".65"/></svg>`;
$('world').appendChild(ballEl);

// ─────────────────────────── timing (absolute seconds) ───────────────────────────
const T = {
  peek: 0.55, pawHit: 1.08, ballBorn: 1.12, propHit1: 1.62, propHit2: 1.98,
  schedIn: 2.32, snap0: 2.95, snapDT: 0.165,
  burst: [[5.36, '一周的事'], [5.74, '一爪'], [6.10, '收好!']], burstEnd: 6.52,
  rosterIn: 6.55, gather0: 7.12, gatherDT: 0.22,
  knot: 10.05, stampBorn: 10.62, stampUp: 10.72, stampHit: 11.42,
  barGo: 11.52,
  planIn: 13.95, f0: 14.45, fDT: 0.42, planOk: 16.42,
  catch: 19.85,
  wm0: 24.55, wmDT: 0.115, tagIn: 25.85, orgIn: 26.35,
  blink: 28.55, paw: 29.2
};

// ─────────────────────────── seek ───────────────────────────
function show(el) { el.style.display = el.id === 'stamp' ? 'flex' : 'block'; }
function place(el, x, y, s = 1, op = 1, blur = 0, extra = '') {
  el.style.opacity = op;
  el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s.toFixed(4)}) ${extra}`;
  el.style.filter = blur > 0.2 ? `blur(${blur.toFixed(1)}px)` : 'none';
}

function seek(t) {
  // ── camera & yarn ──
  const CAM = camAt(t);
  $('world').style.transform = `matrix(${OM.view(CAM).join(',')})`;
  drawYarn(t);

  // ── props: knocked over as the yarn passes ──
  [['note1', T.propHit1], ['note2', T.propHit2], ['clip1', 1.8]].forEach(([id, th]) => {
    const el = $(id), vis = t > 0.2 && t < 24.5;
    if (!vis) { el.style.display = 'none'; return; }
    show(el);
    const hit = OM.impact(t, th, { decay: 8, omega: 20, sqx: 0.2, sqy: 0.18 });
    const flip = sstep(th, th + 0.35, t);
    const base = id === 'note1' ? -7 : id === 'note2' ? 6 : 0;
    el.style.transform = `rotate(${(base + flip * (id === 'clip1' ? 38 : 24)).toFixed(2)}deg) scale(${hit.sx.toFixed(3)},${hit.sy.toFixed(3)}) translateY(${(flip * 6).toFixed(1)}px)`;
  });

  // ── cat: peek → paw → hold → catch → blink/paw ──
  {
    const el = $('cat'), vis = t > 0.3;
    if (!vis) { el.style.display = 'none'; }
    else {
      show(el);
      const peek = OM.wordRise(t, T.peek, { zeta: 0.62, omega: 13, dist: 420, s0: 0.92 });
      const paw = OM.press(t, T.pawHit, { depth: 0.12, flash: 0 });
      const catchS = OM.impact(t, T.catch, { decay: 7, omega: 18, sqx: 0.12, sqy: 0.16 });
      const pawWave = OM.impact(t, T.paw, { decay: 5, omega: 14, sqx: 0.05, sqy: 0.04 });
      const bob = (t > T.catch && t < T.catch + 0.5) ? catchS.sy : 1;
      const rot = (paw.down && t < T.pawHit + 0.5 ? -5.5 : 0)
        + (t > T.paw ? Math.sin((t - T.paw) * 22) * 3 * (1 - sstep(T.paw, T.paw + 0.6, t)) : 0);
      el.style.transform = `translate(2340px, ${(2230 + (1 - peek.op) * 320 + (paw.down ? 16 : 0)).toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${(peek.s * pawWave.sx).toFixed(4)},${(peek.s * bob * pawWave.sy).toFixed(4)})`;
      el.style.opacity = peek.op;
      const bl = (t > T.blink && t < T.blink + 0.14) ? 1 : 0;
      $('lidL').style.opacity = bl; $('lidR').style.opacity = bl;
    }
  }

  // ── schedule: card in, misaligned cells snap one by one ──
  {
    const el = $('sched'), vis = t > T.schedIn - 0.1 && t < 6.7;
    if (!vis) { el.style.display = 'none'; }
    else {
      show(el);
      const ei = OM.popIn(t, T.schedIn, { rise: 90, s0: 0.88 });
      const eo = t > 5.95 ? OM.liftOut(t, 5.95, { dur: 0.5, dist: -60, blur: 5 }) : { op: 1, dy: 0, s: 1, blur: 0 };
      place(el, 0, ei.dy + eo.dy, ei.s * eo.s, ei.op * eo.op, eo.blur);
      el.querySelectorAll('.gcell').forEach(c => {
        const idx = +c.dataset.snap;
        if (idx < 0) { c.style.transform = 'none'; c.style.opacity = 1; return; }
        const th = T.snap0 + idx * T.snapDT;
        const st = OM.impact(t, th, { decay: 9, omega: 24, sqx: 0.18, sqy: 0.14 });
        const pre = 1 - sstep(th - 0.26, th - 0.02, t);
        const ang = ((idx * 37) % 25) - 12;
        const dx = ((idx * 83) % 90) - 45, dy = ((idx * 57) % 70) - 35;
        c.style.transform = `translate(${(dx * pre).toFixed(1)}px,${(dy * pre).toFixed(1)}px) rotate(${(ang * pre).toFixed(2)}deg) scale(${(st.sx * lerp(0.82, 1, 1 - pre)).toFixed(3)},${(st.sy * lerp(0.82, 1, 1 - pre)).toFixed(3)})`;
        c.style.opacity = lerp(0.25, 1, 1 - pre);
      });
    }
  }

  // ── roster: cards scatter → gather into a stack ──
  {
    const el = $('roster'), vis = t > T.rosterIn - 0.1 && t < 9.6;
    if (!vis) { el.style.display = 'none'; }
    else {
      show(el);
      const ei = OM.popIn(t, T.rosterIn, { rise: 70, s0: 0.9 });
      const eo = t > 9.05 ? OM.liftOut(t, 9.05, { dur: 0.5, blur: 5 }) : { op: 1, dy: 0, s: 1, blur: 0 };
      place(el, 0, ei.dy + eo.dy, ei.s * eo.s, ei.op * eo.op, eo.blur);
      el.querySelectorAll('.mcard').forEach((m, i) => {
        const th = T.gather0 + i * T.gatherDT;
        const g = OM.gather(t, th, th + 0.62, i, 3,
          { x: 40 + i * 90, y: 20 + i * 108 }, { x: 150, y: 100 }, { stagger: 0, arc: 46, spin: 0.05 });
        const land = OM.impact(t, th + 0.62, { decay: 8, omega: 20, sqx: 0.1, sqy: 0.12 });
        m.style.transform = `translate(${g.x.toFixed(1)}px,${g.y.toFixed(1)}px) rotate(${(g.rot * 38).toFixed(2)}deg) scale(${land.sx.toFixed(3)},${land.sy.toFixed(3)})`;
      });
    }
  }

  // ── stamp: knot tightens → disc born → lifts → presses onto the signin card ──
  {
    const el = $('stamp'), ring = $('stampRing'), vis = t > T.stampBorn && t < T.stampHit + 1.75;
    if (!vis) { el.style.display = 'none'; ring.style.display = 'none'; }
    else {
      show(el); show(ring);
      const born = OM.impact(t, T.stampBorn + 0.1, { decay: 6, omega: 18, sqx: 0.22, sqy: 0.22 });
      const down = ssstep(T.stampUp + 0.35, T.stampHit, t);
      const x = lerp(2745, 3020, down), y = 2130 - Math.sin(Math.min(down, 1) * Math.PI) * 130;
      const press = OM.press(t, T.stampHit, { depth: 0.16, flash: 0.5 });
      const s = born.sx * press.s;
      const yy = y + (press.down ? 10 : 0);
      el.style.transform = `translate(${(x - 95).toFixed(1)}px,${(yy - 95).toFixed(1)}px) scale(${s.toFixed(3)})`;
      el.style.opacity = born.op * (1 - sstep(T.stampHit + 1.35, T.stampHit + 1.7, t));
      const r = sstep(T.stampHit, T.stampHit + 0.55, t);
      ring.style.transform = `translate(${(x - 95).toFixed(1)}px,${(yy - 95).toFixed(1)}px) scale(${(1 + r * 2.2).toFixed(3)})`;
      ring.style.opacity = t > T.stampHit ? (1 - r) * 0.7 : 0;
    }
  }

  // ── signin card: chips flip, bar fills after the stamp ──
  {
    const el = $('signin'), vis = t > T.stampUp && t < 13.75;
    if (!vis) { el.style.display = 'none'; }
    else {
      show(el);
      const ei = OM.popIn(t, T.stampUp + 0.25, { rise: 60, s0: 0.92 });
      const eo = t > 13.35 ? OM.liftOut(t, 13.35, { dur: 0.45, blur: 5 }) : { op: 1, dy: 0, s: 1, blur: 0 };
      place(el, 0, ei.dy + eo.dy, ei.s * eo.s, ei.op * eo.op, eo.blur);
      const go = sstep(T.barGo, T.barGo + 0.55, t);
      $('barFill').style.width = (87.5 + go * 12.5) + '%';
      $('chipOk').textContent = go > 0.6 ? '已签 32' : '已签 28';
      $('chipNo').textContent = go > 0.6 ? '未签 0' : '未签 4';
      $('chipNo').className = 'chip ' + (go > 0.6 ? 'green' : 'pink');
      $('barTx').textContent = go > 0.6 ? '32 / 32 · 全部到齐' : '28 / 32 · 扫码签到';
      $('pp3').className = 'ppill' + (go > 0.6 ? ' done' : '');
    }
  }

  // ── plan: page out of the yarn → fields type in → approved chip ──
  {
    const el = $('plan'), vis = t > T.planIn - 0.1 && t < 18.2;
    if (!vis) { el.style.display = 'none'; }
    else {
      show(el);
      const ei = OM.popIn(t, T.planIn, { rise: 80, s0: 0.86 });
      const eo = t > 17.75 ? OM.liftOut(t, 17.75, { dur: 0.5, blur: 6 }) : { op: 1, dy: 0, s: 1, blur: 0 };
      place(el, 0, ei.dy + eo.dy, ei.s * eo.s, ei.op * eo.op, eo.blur);
      const FV = [['fv1', '筑牢信仰之基 · 传承红色基因'], ['fv2', '2026-03-05 14:30'], ['fv3', '学院东教学楼 A101'], ['fv4', '信息与智能工程学院党建办公室'], ['fv5', '第四十期入党积极分子学员']];
      FV.forEach(([id, text], i) => {
        const ty = OM.typeOn(t, T.f0 + i * T.fDT, text, { cps: 16, blink: true });
        $(id).innerHTML = ty.str + (ty.caret ? '<i></i>' : '');
      });
      const ok = OM.impact(t, T.planOk, { decay: 7, omega: 20, sqx: 0.3, sqy: 0.3 });
      $('planOk').style.transform = `scale(${ok.sx.toFixed(3)},${ok.sy.toFixed(3)})`;
      $('planOk').style.opacity = t > T.planOk - 0.02 ? 1 : 0;
    }
  }

  // ── ball ──
  {
    const el = ballEl, vis = t > T.ballBorn - 0.02 && t < 30;
    if (!vis) { el.style.display = 'none'; }
    else {
      show(el);
      const [x, y] = ballPos(t);
      const [x2, y2] = ballPos(clamp(t + 1 / FPS, T.ballBorn, 21));
      const [x1, y1] = ballPos(clamp(t - 1 / FPS, T.ballBorn, 21));
      const q = OM.squash(x2 - x1, y2 - y1, { k: 0.006, max: 0.35 });
      const born = OM.impact(t, T.ballBorn, { decay: 10, omega: 26, sqx: 0.35, sqy: 0.35 });
      const catchI = OM.impact(t, T.catch, { decay: 9, omega: 22, sqx: 0.4, sqy: 0.4 });
      el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${q.ang.toFixed(3)}rad) scale(${(q.sx * born.sx * catchI.sx).toFixed(3)},${(q.sy * born.sx * catchI.sx).toFixed(3)})`;
    }
  }

  // ── staccato burst (screen space, hard cuts) ──
  {
    const hits = T.burst;
    let word = '', idx = -1;
    for (let i = 0; i < hits.length; i++) {
      const end = i < hits.length - 1 ? hits[i + 1][0] : T.burstEnd;
      if (t >= hits[i][0] && t < end) { word = hits[i][1]; idx = i; break; }
    }
    $('stac').style.opacity = idx >= 0 ? 1 : 0;
    $('stac').style.display = idx >= 0 ? 'block' : 'none';
    ['hit1', 'hit2', 'hit3'].forEach((id, i) => {
      $(id).textContent = i === idx ? word : '';
      if (i === idx) {
        const im = OM.impact(t, hits[i][0] + 0.02, { decay: 8, omega: 19, sqx: 0.14, sqy: 0.12 });
        $(id).style.transform = `scale(${im.sx.toFixed(3)},${im.sy.toFixed(3)})`;
      }
    });
  }

  // ── brand lockup ──
  {
    const el = $('brand'), vis = t > T.wm0 - 0.05;
    if (!vis) { el.style.display = 'none'; }
    else {
      show(el);
      wmSpans.forEach((s, i) => {
        const d = OM.letterDrop(t, T.wm0 + i * T.wmDT, i, { stagger: 0, dist: 320, squash: 1 });
        s.style.opacity = d.op;
        s.style.transform = `translateY(${d.y.toFixed(1)}px) scale(${(1 + d.sx * 0.55).toFixed(4)},${(1 - d.sx * 0.9).toFixed(4)})`;
      });
      const tg = OM.wordRise(t, T.tagIn, { zeta: 0.6, omega: 18, dist: 60 });
      el.querySelector('.tag').style.opacity = tg.op;
      const tw = OM.impact(t, T.tagIn + 0.14, { decay: 7, omega: 21, sqx: 0.12, sqy: 0.16 });
      el.querySelector('.tag').style.transform = `translateY(${tg.y.toFixed(1)}px) scale(${tw.sx.toFixed(3)},${tw.sy.toFixed(3)})`;
      const og = OM.wordRise(t, T.orgIn, { zeta: 0.7, omega: 16, dist: 40 });
      el.querySelector('.org').style.opacity = og.op;
      el.querySelector('.org').style.transform = `translateY(${og.y.toFixed(1)}px)`;
    }
  }

  $('hud').textContent = 't=' + t.toFixed(3);
  window.__lastT = t;
  return true;
}

// ─────────────────────────── track / motion / ready ───────────────────────────
window.__track = t => {
  const M = OM.view(camAt(t));
  const [bx, by] = t > 1.12 ? ballPos(t) : [2470, 2620];
  return {
    ball: OM.projectBox(M, { x: bx - 44, y: by - 44, w: 88, h: 88 }),
    cat: OM.projectBox(M, { x: 2340, y: 2230, w: 520, h: 509 }),
    wm: { x: 610, y: 150, w: 700, h: 300 }
  };
};
window.__motion = (t0, t1) => {
  const mid = (t0 + t1) / 2;
  const travel = OM.screenTravel(camAt(t0), camAt(t1), camAt(mid));
  const [x0, y0] = ballPos(clamp(t0, 1.12, 21)), [x1, y1] = ballPos(clamp(t1, 1.12, 21));
  const c = camAt(mid);
  const ballTravel = Math.hypot(x1 - x0, y1 - y0) * c.zoom;
  const e0 = spline(WAY, trailEnd(clamp(t0, 1.12, 30))), e1 = spline(WAY, trailEnd(clamp(t1, 1.12, 30)));
  const reelTravel = Math.hypot(e1[0] - e0[0], e1[1] - e0[1]) * c.zoom;
  return Math.max(travel, ballTravel, reelTravel);
};
// sound events: fewer events than beats — one room, one material set (see README)
window.__events = () => [
  { t: 1.08, kind: 'paw',   gain: 0.9 },   // paw press (wood thud)
  { t: 1.14, kind: 'pop',   gain: 0.8 },   // ball born (bubble)
  { t: 1.62, kind: 'tap',   gain: 0.5 },   // note knocked (wood tick)
  { t: 3.05, kind: 'snap',  gain: 0.45 },  // cells start snapping (3 ticks, not 10)
  { t: 3.55, kind: 'snap',  gain: 0.4 },
  { t: 4.30, kind: 'snap',  gain: 0.4 },
  { t: 5.36, kind: 'hit',   gain: 0.85 },  // burst word 1
  { t: 5.74, kind: 'hit',   gain: 0.8 },
  { t: 6.10, kind: 'hit',   gain: 0.9 },
  { t: 7.12, kind: 'swoosh',gain: 0.45 },  // cards gather
  { t: 10.35, kind: 'slide', gain: 0.5 },  // knot tightens
  { t: 11.42, kind: 'stamp', gain: 1.0 },  // stamp lands (sub thud + wood)
  { t: 13.35, kind: 'swoosh', gain: 0.55 }, // yarn whips the plan out
  { t: 16.42, kind: 'chime', gain: 0.5 },  // approved chip
  { t: 18.3, kind: 'whoosh', gain: 0.6 },  // ball rolls home
  { t: 19.85, kind: 'catch', gain: 0.85 }, // caught in the paws
  { t: 20.22, kind: 'pop',   gain: 0.8 },  // bow pops
  { t: 23.45, kind: 'drop',  gain: 0.6 },  // wordmark lands
  { t: 25.05, kind: 'chime', gain: 0.45 }, // tagline
  { t: 28.6, kind: 'blink',  gain: 0.3 }   // the easter-egg blink
];
window.__seek = async t => seek(t);
window.__ready = Promise.all([document.fonts.ready, $('catimg').decode().catch(() => {})]).then(() => {
  const nc = document.createElement('canvas'); nc.width = nc.height = 256;
  const nx = nc.getContext('2d'), im = nx.createImageData(256, 256);
  let seed = 1234567;
  for (let i = 0; i < im.data.length; i += 4) {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    const v = (seed & 1) ? 255 : 0;
    im.data[i] = im.data[i+1] = im.data[i+2] = v; im.data[i+3] = 6;
  }
  nx.putImageData(im, 0, 0);
  $('noise').style.background = 'url(' + nc.toDataURL() + ')';
  return seek(0);
});
const q = new URLSearchParams(location.search);
if (q.has('t')) __ready.then(() => seek(parseFloat(q.get('t'))));
if (q.has('hud')) $('hud').style.display = 'block';
if (q.has('play')) __ready.then(() => {
  const t0 = performance.now();
  (function loop() { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })();
});
</script>
